version: 2.1
orbs:
  trigger-tests: mabl/trigger-tests@1.0.8
# Example .circleci/config.yml snippet
workflows:
  build-and-test:
    jobs:
      - trigger-mabl-tests:
          context: mabl-api-key # Optional: Use a context for security
          filters:
            branches:
              only: [main, develop]
          # Example: Trigger all tests for a specific application and environment
          mabl-trigger-tests:
  
            environment-id: "niIn0o7r5dqEA4GdaK2hGQ-e"
            # OR use labels:
            # plan-labels: "regression,smoke-test"
            await-completion: true # Wait for tests to finish before proceeding
